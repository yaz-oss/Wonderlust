name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Backend - install
        working-directory: backend
        run: |
          npm ci

      - name: Backend - lint
        working-directory: backend
        run: |
          npm run lint --if-present

      - name: Backend - build
        working-directory: backend
        run: |
          npm run build --if-present

      - name: Backend - test
        working-directory: backend
        run: |
          npm test --if-present

      - name: Frontend - install
        working-directory: frontend
        run: |
          npm ci

      - name: Frontend - lint
        working-directory: frontend
        run: |
          npm run lint --if-present

      - name: Frontend - build
        working-directory: frontend
        run: |
          npm run build --if-present

      - name: Frontend - test
        working-directory: frontend
        run: |
          npm test --if-present
